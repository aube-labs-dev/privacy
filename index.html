<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aube-labs · Privacy Policies</title>
<style>
  :root { --navy:#0D1B2A; --gold:#C9A84C; --gold-l:#F5D06E; --bg:#f7f8fa; --text:#1c2530; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
         line-height: 1.7; color: var(--text); background: var(--bg); margin: 0; }
  .hero { background: linear-gradient(135deg, var(--navy), #162438); color: #fff; padding: 56px 24px; text-align: center; }
  .hero h1 { margin: 0 0 8px; font-size: 2rem; }
  .hero .gold { color: var(--gold-l); }
  .hero p { margin: 4px 0; opacity: .85; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 24px 64px; }
  .apps { list-style: none; padding: 0; margin: 0; }
  .apps li { background: #fff; border-radius: 14px; margin-bottom: 16px;
             box-shadow: 0 2px 14px rgba(13,27,42,.06); transition: transform .15s; }
  .apps li:hover { transform: translateY(-2px); }
  .apps a { display: flex; align-items: center; justify-content: space-between;
            padding: 22px 26px; text-decoration: none; color: var(--navy); font-size: 1.15rem; font-weight: 600; }
  .apps a .arrow { color: var(--gold); font-size: 1.4rem; }
  footer { text-align: center; color: #8a94a0; font-size: .82rem; padding: 24px; }
</style>
</head>
<body>
<div class="hero">
  <h1>aube<span class="gold">-labs</span></h1>
  <p>Privacy Policies</p>
</div>
<main>
  <ul class="apps">
    <li><a href="./hifive/">HiFive <span class="arrow">→</span></a></li>
  </ul>
</main>
<footer>© 2026 aube-labs</footer>
</body>
</html>
